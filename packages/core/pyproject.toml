[project]
name = "myroad-core"
version = "0.9.0"
description = "MyRoad POC: path store + agent tools + registration, SQLite users, content split, Cloudflare AI Gateway BYOK agent path builder + golden loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myroad_core = ["ui/templates/*", "ui/static/*"]
# content JSON lives at packages/core/content (loaded by path, not package-data)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
