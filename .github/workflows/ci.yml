name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-freeze-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate freeze path JSON
        run: |
          for f in freeze/v0/01-path-before-feedback.json freeze/v0/02-path-after-feedback.json; do
            test -f "$f"
            python -m json.tool "$f" > /dev/null
          done
          echo "Both freeze path JSON files are valid."
        # Content JSON is loaded and schema-checked by the core tests below.

  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Vendor MyRoad-content
        run: |
          set -e
          git clone --depth 1 "https://github.com/Eliot100/MyRoad-content.git" /tmp/MyRoad-content
          mkdir -p content
          cp -R /tmp/MyRoad-content/. content/ && rm -rf content/.git
          test "$(find content -name '*.json' | wc -l)" -ge 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml

      - name: Install package + pytest (+ api for learner UI)
        run: pip install -e ".[dev,api]"

      - name: Run core unit tests (persistence + agent tools + UI + secrets)
        env:
          CONTENT_DIR: ${{ github.workspace }}/packages/core/content
        run: pytest -q

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin MyRoad-content to its current main commit
        id: content
        run: echo "ref=$(git ls-remote https://github.com/Eliot100/MyRoad-content.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --build-arg CONTENT_REF=${{ steps.content.outputs.ref }} -t myroad:ci .

      - name: Image has no secrets or databases baked in
        run: |
          docker run --rm --entrypoint sh myroad:ci -c \
            'test "$(id -u)" != 0 && ! find /app /data \( -name ".env" -o -name "*.db" -o -name "*.sqlite*" \) | grep .'

      - name: Run the image and smoke-test it
        run: |
          docker run -d --name myroad -p 8080:8080 myroad:ci
          scripts/smoke.sh http://127.0.0.1:8080 || { docker logs myroad; exit 1; }
          docker logs myroad 2>&1 | tail -20
