name: a11y

# axe-core + Playwright over the core learner flow (issue #61, decision 0008).
# Not a required check yet: make it required after ~5 green runs on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Same vendoring as core-tests in ci.yml (content is never committed).
      - name: Vendor MyRoad-content
        run: |
          set -e
          git clone --depth 1 "https://github.com/Eliot100/MyRoad-content.git" /tmp/MyRoad-content
          mkdir -p content
          cp -R /tmp/MyRoad-content/. content/ && rm -rf content/.git
          test "$(find content -name '*.json' | wc -l)" -ge 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/core/tests_a11y/requirements.txt

      - name: Install package + pinned Playwright/axe
        run: pip install -e ".[dev,api]" -r tests_a11y/requirements.txt

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('packages/core/tests_a11y/requirements.txt') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run axe over the learner flow (375/1280 x light/dark)
        env:
          CONTENT_DIR: ${{ github.workspace }}/packages/core/content
          A11Y_REPORT: ${{ runner.temp }}/a11y-report.json
        run: pytest tests_a11y -q -p no:cacheprovider

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-report
          path: ${{ runner.temp }}/a11y-report.json
          if-no-files-found: ignore
