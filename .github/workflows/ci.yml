name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-freeze-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure freeze path JSON files exist
        run: |
          test -f freeze/v0/01-path-before-feedback.json
          test -f freeze/v0/02-path-after-feedback.json

      - name: Validate path JSON (python json.tool)
        run: |
          python -m json.tool freeze/v0/01-path-before-feedback.json > /dev/null
          python -m json.tool freeze/v0/02-path-after-feedback.json > /dev/null
          echo "Both freeze path JSON files are valid."

      - name: Validate grade3 content JSON
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("packages/core/content/grade3")
          files = sorted(root.glob("*.json"))
          assert len(files) == 10, files
          for f in files:
              json.load(f.open(encoding="utf-8"))
          print(f"Validated {len(files)} content files.")
          PY

  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pytest (+ api for learner UI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run core unit tests (persistence + agent tools + UI)
        run: pytest -q
