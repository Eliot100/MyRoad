name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-freeze-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure freeze path JSON files exist
        run: |
          test -f freeze/v0/01-path-before-feedback.json
          test -f freeze/v0/02-path-after-feedback.json

      - name: Validate path JSON (python json.tool)
        run: |
          python -m json.tool freeze/v0/01-path-before-feedback.json > /dev/null
          python -m json.tool freeze/v0/02-path-after-feedback.json > /dev/null
          echo "Both freeze path JSON files are valid."

      - name: Vendor MyRoad-content (grade3 samples)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p packages/core/content
          # Prefer sibling content repo; fall back to API archive
          if git clone --depth 1 "https://github.com/Eliot100/MyRoad-content.git" /tmp/MyRoad-content; then
            cp -R /tmp/MyRoad-content/grade3 packages/core/content/
          else
            echo "MyRoad-content clone failed — expecting CONTENT_DIR or vendored files"
            exit 1
          fi
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("packages/core/content/grade3")
          files = sorted(root.glob("*.json"))
          assert len(files) == 10, files
          for f in files:
              json.load(f.open(encoding="utf-8"))
          print(f"Validated {len(files)} content files.")
          PY

  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor MyRoad-content
        run: |
          set -e
          git clone --depth 1 "https://github.com/Eliot100/MyRoad-content.git" /tmp/MyRoad-content
          mkdir -p content
          cp -R /tmp/MyRoad-content/grade3 content/
          test "$(ls content/grade3/*.json | wc -l)" -eq 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pytest (+ api for learner UI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run core unit tests (persistence + agent tools + UI + secrets)
        env:
          CONTENT_DIR: ${{ github.workspace }}/packages/core/content
        run: pytest -q
